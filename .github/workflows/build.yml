name: Build

on:
  push:
    branches:
      - "release/**"
  pull_request:
    branches:
      - "main"
      - "release/**"

jobs:
  build-linux:
    name: Debug Build Linux

    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app
          submodules: recursive
          fetch-depth: 0
      - name: Compile
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang cmake git \
            ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libstdc++-12-dev
          mkdir package/
          ./tools/build.sh -t linux -f foss,freemium -b package/ -V
        working-directory: app

  build-windows:
    name: Debug Build Windows
    runs-on: "windows-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app
          submodules: recursive
          fetch-depth: 0
      - name: Compile
        run: |
          ./tools/build.sh -t windows -f foss,freemium -b package/ -V
        working-directory: app
        shell: bash

  build-macos:
    name: Debug Build macOS
    runs-on: "macos-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app
          submodules: recursive
          fetch-depth: 0
      - name: Compile
        run: |
          ./tools/build.sh -t macos -f foss,freemium -b package/ -V
        working-directory: app

  build-android:
    name: Debug Build Android
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app
          submodules: recursive
          fetch-depth: 0
      - name: Compile
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang cmake git \
            ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libstdc++-12-dev
          ./tools/build.sh -t android -f foss,freemium -b package/ -V
        working-directory: app

  build-ios:
    name: Debug Build iOS
    runs-on: "macos-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app
          submodules: recursive
          fetch-depth: 0
      - name: Compile
        run: |
          ./tools/build.sh -t ios -f foss,freemium -b package/ -V
        working-directory: app

  test:
    name: Run Tests

    runs-on: "ubuntu-latest"

    needs: [build-linux, build-windows, build-macos, build-android, build-ios]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app
          submodules: recursive
          fetch-depth: 0

      - name: Run Tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            clang cmake git \
            ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libstdc++-12-dev
          .flutter/bin/flutter test
